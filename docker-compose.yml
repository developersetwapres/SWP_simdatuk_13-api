services:
  simdatuk13-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: simdatuk13-api:latest
    container_name: simdatuk13-api
    restart: always

    ports:
      - "8011:8080"

    env_file:
      - ./src/.env

    networks:
      - simdatuk_network

networks:
  simdatuk_network:
    name: simdatuk_network
