services:
  simdatuk13-api_app:
    build:
      context: .
      dockerfile: Dockerfile

    image: simdatuk13-api:latest
    container_name: swp_simdatuk13-api

    restart: unless-stopped

    working_dir: /var/www

    ports:
      - "8011:8080"

    env_file:
      - ./src/.env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      TZ: Asia/Jakarta

    networks:
      - nginx-network

networks:
  nginx-network:
    external: true
