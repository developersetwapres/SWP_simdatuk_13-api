services:
  simdatuk-api_app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: simdatuk-api:latest
    container_name: swp_simdatuk-api
    restart: unless-stopped
    working_dir: /var/www/
    ports:
      - "8005:8080"
    networks:
      - dbmysql-network
      - s3minio-network

networks:
  dbmysql-network:
    external: true

  s3minio-network:
    external: true
