; =========================================================
; SIMDATUK - PHP Production Configuration
; =========================================================

; GENERAL SECURITY
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = Asia/Jakarta

; Disable selected functions, but preserve functions needed
; by Composer, Symfony Process, and HTTP clients.
disable_functions = exec,passthru,shell_exec,system,popen,show_source

; =========================================================
; SESSION SECURITY
; =========================================================

session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
session.cookie_lifetime = 7200

; =========================================================
; FILE UPLOAD
; =========================================================

file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

; =========================================================
; RESOURCE LIMITS
; =========================================================

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; =========================================================
; OPcache
; =========================================================

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; =========================================================
; ERROR REPORTING
; =========================================================

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT